name: Java Flink CI
on:
  push:
    branches: [main]
    paths: ["src/**", "pom.xml", "Dockerfile", ".github/workflows/java-ci.yml"]
  pull_request:
  workflow_dispatch:
jobs:
  test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - run: mvn -B clean verify
      - uses: actions/upload-artifact@v4
        with:
          name: fraudstream-java-jar
          path: target/*-all.jar
